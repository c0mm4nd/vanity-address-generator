[package]
edition = "2021"
name = "vag"
version = "0.1.0"

[profile.release]
codegen-units = 1
lto = "fat"
panic = "abort"

[dependencies]
eip55 = "0.4"
bip0039 = "0.11"
clap = {version = "4", features = ["derive"]}
hex = "0.4"
libsecp256k1 = "0.7"
num_cpus = "1"
tiny-hderive = "0.3"
tiny-keccak = {version = "2", features = ['keccak']}
regex = "1"
# Bitcoin dependencies
bs58 = "0.5.0"
ripemd = "0.1.3"
sha2 = "0.10.7"
bech32 = "0.9.1"
# Solana dependencies
base58 = "0.2.0"
ed25519-dalek = "1.0.1"
# JSON serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
# GPU support
ocl = "0.19"
rand = "0.8"
rand_core = "0.6"
secp256k1 = "0.30.0"
slip10_ed25519 = "0.1.3"
